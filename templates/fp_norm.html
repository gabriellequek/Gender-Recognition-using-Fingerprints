<!DOCTYPE html>
<html>
    <head>
        <title>Project AIFP</title>
        <link rel="icon" href="/static/web_icon.png">
        <style>
            body {
                background-color: rgb(0, 0, 0);
                margin: 0;
                padding: 40px 20px 80px;
            }

            h1 {
                color: rgb(255, 255, 255);
                text-align: center;
                font-family: monospace;
                font-size: 40px; 
                margin-bottom:10px;
            }
            #fp_icon {
                display:inline;
                position: relative;
                top: 8px
            }
 
            #upload {
                text-align: center;
            }

            #dropzone {
                max-width: 360px;
                margin: 16px auto 0;
                padding: 30px 20px;
                border: 2px dashed rgb(120, 120, 120);
                border-radius: 8px;
                transition: border-color 0.15s ease, background-color 0.15s ease;
            }

            #dropzone.dragover {
                border-color: rgb(44,255,61);
                background-color: rgba(44,255,61,0.05);
            }

            #dropzone-hint {
                font-family: monospace;
                font-size: 12px;
                color: rgb(128,128,128);
                margin: 10px 0 0;
            }

            #custom-button,
            #analyze-button {
                padding: 10px;
                color: white;
                background-color: black;
                border: 1px solid white;
                border-radius: 5px;
                cursor: grab;
                font-family: monospace;
                font-size: 15px;
            }


            #analyze-button {
                margin-top: 14px;
                cursor: pointer;
            }

            #analyze-button:disabled {
                color: rgb(120, 120, 120);
                border-color: rgb(90, 90, 90);
            }

            #custom-text {
                font-family: monospace;
                font-size: 12px;
                color: rgb(128,128,128);
            }

            p {
                color: rgb(255, 255, 255);
                font-family: monospace;
                font-size: 20px
            }
           
            span {
                color: rgb(255,255,255);
            }

            #preview-img {
                display: block;
                max-width: 260px;
                max-height: 260px;
                margin: 20px auto 0;
                border: 1px solid white;
                border-radius: 5px;
            }

            #error-text {
                color: rgb(255, 120, 120);
                font-family: monospace;
                font-size: 13px;
            }

            #loading p {
                text-align: center;
                font-family: monospace;
                color: rgb(44,255,61);
                margin-top: 40px;
               }
            #loading p::after {
                 content: '';
                 display: inline-block;
                 width: 1em;
                 text-align: left;
                 animation: dots 1s steps(4, end) infinite;
                }

            @keyframes dots {
                 0%   { content: ''; }
                 25%  { content: '.'; }
                 50%  { content: '..'; }
                 75%  { content: '...'; }
                 100% { content: '...'; }
                }
            /* --- Results --- */

            #results {
                max-width: 640px;
                margin: 50px auto 0;
                text-align: center;
            }
            
            #complete-text {
                color: white;
                font-family: monospace;
                margin-bottom: 30px;
            }

            #image-compare {
                display: flex;
                justify-content: center;
                gap: 24px;
                flex-wrap: wrap;
            }

            .image-block {
                max-width: 260px;
            }

            .image-block img,
            .image-block canvas {
                display: block;
                max-width: 260px;
                max-height: 340px;
                width: auto;
                height: auto;
                border: 1px solid white;
                border-radius: 5px;
                margin: 0 auto;
             }

            .image-caption {
                font-family: monospace;
                font-size: 13px;
                margin-top: 8px;
            }

            /* --- RGB sliders --- */

            #rgb-controls {
                margin-top: 16px;
                text-align: left;
                display: inline-block;
            }

            .slider-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
                font-family: monospace;
                font-size: 12px;
            }

            .slider-row label {
                width: 14px;
                color: rgb(255,255,255);
            }

            .slider-row input[type="range"] {
                flex: 1;
                accent-color: rgb(255,255,255);
                height: 4px;
            }

            .slider-row.channel-r input[type="range"] { accent-color: rgb(255,90,90); }
            .slider-row.channel-g input[type="range"] { accent-color: rgb(90,255,90); }
            .slider-row.channel-b input[type="range"] { accent-color: rgb(90,140,255); }

            .slider-value {
                width: 38px;
                text-align: right;
                color: rgb(180,180,180);
            }

            #rgb-reset {
                margin-top: 6px;
                padding: 4px 10px;
                color: white;
                background-color: black;
                border: 1px solid rgb(120,120,120);
                border-radius: 4px;
                cursor: pointer;
                font-family: monospace;
                font-size: 11px;
            }

            @media (max-width: 560px) {
                .image-block {
                    width: 90%;
                    max-width: 300px;
                }
            }
        </style>
    </head>

    <body>
        <div id="page-header">
            <h1>Project AIFP
            <img id="fp_icon" src="/static/fp_icon.png" alt="fingerprint_icon" style="width:45px; height:45px;">
            </h1>
        </div>

        <section id="upload">
            <img id="mg" src="/static/edit_icon.jpg" alt="image editing" style="width:50px; height:50px;">
            <p>Upload a fingerprint image to begin.</p>

            <div id="dropzone">
                <input type="file" id="real-file" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff" hidden="hidden"/>
                <button type="button" id="custom-button">CHOOSE A FILE</button>
                <p id="dropzone-hint">or drag and drop an image here</p>
                <p id="custom-text">No file chosen yet.</p>

                <img id="preview-img" hidden />
            </div>

            <br>
            <button type="button" id="analyze-button" disabled>PROCESS IMAGE</button>
            <p id="error-text" hidden></p>
        </section>

        <section id="loading" hidden>
            <p>Processing</p>
        </section>

        <section id="results" hidden>
            <p id="complete-text">RESULTS</p>

            <div id="image-compare">
                <div class="image-block">
                    <img id="input-image" />
                    <p class="image-caption">Original</p>
                </div>
                <div class="image-block">
                    <canvas id="normalized-canvas"></canvas>
                    <p class="image-caption">Normalised</p>

                    <div id="rgb-controls">
                        <div class="slider-row channel-r">
                            <label for="slider-r">R</label>
                            <input type="range" id="slider-r" min="0" max="200" value="100" step="1">
                            <span class="slider-value" id="value-r">100%</span>
                        </div>
                        <div class="slider-row channel-g">
                            <label for="slider-g">G</label>
                            <input type="range" id="slider-g" min="0" max="200" value="100" step="1">
                            <span class="slider-value" id="value-g">100%</span>
                        </div>
                        <div class="slider-row channel-b">
                            <label for="slider-b">B</label>
                            <input type="range" id="slider-b" min="0" max="200" value="100" step="1">
                            <span class="slider-value" id="value-b">100%</span>
                        </div>
                        <button type="button" id="rgb-reset">RESET</button>
                    </div>
                </div>
            </div>
        </section>

        <script>
            const dropzone = document.getElementById("dropzone");
            const realFileBtn = document.getElementById("real-file");
            const customBtn = document.getElementById("custom-button");
            const customTxt = document.getElementById("custom-text");
            const previewImg = document.getElementById("preview-img");
            const analyzeBtn = document.getElementById("analyze-button");
            const errorText = document.getElementById("error-text");
            const loadingSection = document.getElementById("loading");
            const resultsSection = document.getElementById("results");

            const inputImage = document.getElementById("input-image");
            const normalizedCanvas = document.getElementById("normalized-canvas");
            const normCtx = normalizedCanvas.getContext("2d");

            const sliderR = document.getElementById("slider-r");
            const sliderG = document.getElementById("slider-g");
            const sliderB = document.getElementById("slider-b");
            const valueR = document.getElementById("value-r");
            const valueG = document.getElementById("value-g");
            const valueB = document.getElementById("value-b");
            const rgbReset = document.getElementById("rgb-reset");

            let selectedFile = null;

            // Holds the untouched pixel data of the normalised image so every
            // slider adjustment is applied fresh from the original, not
            // compounded on top of a previous adjustment.
            let normalizedSourceImageData = null;

            const acceptedExtensions = [".png", ".jpg", ".jpeg", ".bmp", ".tif", ".tiff"];

            customBtn.addEventListener("click", function () {
                realFileBtn.click();
            });

            realFileBtn.addEventListener("change", function () {
                const file = realFileBtn.files && realFileBtn.files[0];
                if (file) {
                    handleFile(file);
                } else {
                    customTxt.innerHTML = "No file chosen yet";
                    analyzeBtn.disabled = true;
                    previewImg.hidden = true;
                }
            });

            ["dragenter", "dragover"].forEach(function (eventName) {
                dropzone.addEventListener(eventName, function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.add("dragover");
                });
            });

            ["dragleave", "dragend"].forEach(function (eventName) {
                dropzone.addEventListener(eventName, function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    dropzone.classList.remove("dragover");
                });
            });

            dropzone.addEventListener("drop", function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove("dragover");

                const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                if (!file) return;

                const nameLower = file.name.toLowerCase();
                const isAccepted = acceptedExtensions.some(function (ext) {
                    return nameLower.endsWith(ext);
                });

                if (!isAccepted) {
                    setError("Unsupported file type. Please drop a PNG, JPG, BMP, or TIFF image.");
                    return;
                }

                // Keep the native file input in sync so a subsequent
                // "CHOOSE A FILE" click / form submission behaves the same
                // way as a drag-and-dropped file.
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                realFileBtn.files = dataTransfer.files;

                handleFile(file);
            });

            function handleFile(file) {
                customTxt.innerHTML = file.name;

                setError(null);
                resultsSection.hidden = true;

                selectedFile = file;
                analyzeBtn.disabled = false;

                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewImg.hidden = false;
                };
                reader.readAsDataURL(file);
            }

            analyzeBtn.addEventListener("click", async function () {
                if (!selectedFile) return;

                setError(null);
                resultsSection.hidden = true;
                loadingSection.hidden = false;
                analyzeBtn.disabled = true;

                const formData = new FormData();
                formData.append("image", selectedFile);

                try {
                    const res = await fetch("/normalize", { method: "POST", body: formData });
                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.error || "Something went wrong.");
                    }

                    renderResults(data);
                } catch (err) {
                    setError(err.message || "Could not reach the server.");
                } finally {
                    loadingSection.hidden = true;
                    analyzeBtn.disabled = false;
                }
            });

            function setError(message) {
                if (!message) {
                    errorText.hidden = true;
                    errorText.innerHTML = "";
                    return;
                }
                errorText.hidden = false;
                errorText.innerHTML = message;
            }

            function renderResults(data) {
                inputImage.src = data.input_image;

                // Load the normalised image into an offscreen Image first so
                // we can draw it to the canvas and read its pixel data.
                const normImg = new Image();
                normImg.onload = function () {
                    normalizedCanvas.width = normImg.naturalWidth;
                    normalizedCanvas.height = normImg.naturalHeight;
                    normCtx.drawImage(normImg, 0, 0);

                    normalizedSourceImageData = normCtx.getImageData(
                        0, 0, normalizedCanvas.width, normalizedCanvas.height
                    );

                    resetSliders();
                    applyRgbAdjustment();
                };
                normImg.src = data.normalized_image;

                resultsSection.hidden = false;
                resultsSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }

            function applyRgbAdjustment() {
                if (!normalizedSourceImageData) return;

                const rMul = sliderR.value / 100;
                const gMul = sliderG.value / 100;
                const bMul = sliderB.value / 100;

                // Copy so the untouched source data is never mutated.
                const src = normalizedSourceImageData.data;
                const out = normCtx.createImageData(
                    normalizedSourceImageData.width,
                    normalizedSourceImageData.height
                );
                const dst = out.data;

                for (let i = 0; i < src.length; i += 4) {
                    dst[i]     = Math.min(255, src[i]     * rMul);
                    dst[i + 1] = Math.min(255, src[i + 1] * gMul);
                    dst[i + 2] = Math.min(255, src[i + 2] * bMul);
                    dst[i + 3] = src[i + 3];
                }

                normCtx.putImageData(out, 0, 0);
            }

            function updateSliderLabels() {
                valueR.textContent = sliderR.value + "%";
                valueG.textContent = sliderG.value + "%";
                valueB.textContent = sliderB.value + "%";
            }

            function resetSliders() {
                sliderR.value = 100;
                sliderG.value = 100;
                sliderB.value = 100;
                updateSliderLabels();
            }

            [sliderR, sliderG, sliderB].forEach(function (slider) {
                slider.addEventListener("input", function () {
                    updateSliderLabels();
                    applyRgbAdjustment();
                });
            });

            rgbReset.addEventListener("click", function () {
                resetSliders();
                applyRgbAdjustment();
            });

            updateSliderLabels();
        </script>
    </body>
</html>
